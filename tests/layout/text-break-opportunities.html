<!DOCTYPE html>
<!-- Line break opportunities as measured in Chromium 148 (a pair table for
     ASCII and Latin-1, the hyphen and digit rule, breaks after spaces, UAX #14
     with newer rules for other characters). Each character is in its own
     span, and the blocks are 1px wide, so every opportunity starts a line. -->
<html>
<head>
<meta charset="utf-8">
<title>Line break opportunities</title>
<style>
  body { margin: 8px; font: 16px/18px sans-serif; }
  .t { width: 1px; margin-bottom: 6px; }
  .h { width: 1px; margin-bottom: 6px; hyphens: none; }
</style>
</head>
<body>
  <div class="t"><span>h</span><span>t</span><span>t</span><span>p</span><span>s</span><span>:</span><span>/</span><span>/</span><span>e</span><span>n</span><span>.</span><span>w</span><span>i</span><span>k</span><span>i</span><span>p</span><span>e</span><span>d</span><span>i</span><span>a</span><span>.</span><span>o</span><span>r</span><span>g</span><span>/</span><span>w</span><span>i</span><span>k</span><span>i</span><span>/</span><span>W</span><span>e</span><span>b</span><span>_</span><span>b</span><span>r</span><span>o</span><span>w</span><span>s</span><span>e</span><span>r</span></div>
  <div class="t"><span>9</span><span>7</span><span>8</span><span>-</span><span>1</span><span>-</span><span>4</span><span>5</span><span>0</span><span>3</span><span>-</span><span>6</span><span>4</span><span>3</span><span>8</span><span>-</span><span>6</span></div>
  <div class="t"><span>(</span><span>-</span><span>1</span><span>)</span></div>
  <div class="t"><span>a</span><span>-</span><span>-</span><span>b</span></div>
  <div class="t"><span>x</span><span> </span><span>-</span><span>5</span></div>
  <div class="t"><span>a</span><span>.</span><span>(</span><span>b</span></div>
  <div class="t"><span>&quot;</span><span>(</span><span>b</span></div>
  <div class="t"><span>a</span><span>(</span><span>b</span></div>
  <div class="t"><span>a</span><span>]</span><span>b</span><span>}</span><span>c</span><span>!</span><span>d</span><span>|</span><span>e</span></div>
  <div class="t"><span>a</span><span>?</span><span>b</span></div>
  <div class="t"><span>a</span><span> </span><span>b</span></div>
  <div class="t"><span>x</span><span>-</span><span>é</span></div>
  <div class="t"><span>-</span><span>é</span></div>
  <div class="t"><span>6</span><span>4</span><span>–</span><span>7</span><span>1</span></div>
  <div class="t"><span>a</span><span>—</span><span>b</span></div>
  <div class="t"><span>“</span><span>a</span><span>”</span><span>.</span></div>
  <div class="t"><span>a</span><span> </span><span>)</span></div>
  <div class="t"><span>a</span><span> </span><span>;</span><span>b</span></div>
  <div class="t"><span>C</span><span>+</span><span>+</span><span>/</span><span>C</span><span>#</span></div>
  <div class="t"><span>d</span><span>o</span><span>i</span><span>:</span><span>1</span><span>0</span><span>.</span><span>1</span><span>1</span><span>4</span><span>5</span><span>/</span><span>3</span><span>2</span><span>4</span><span>0</span><span>4</span><span>3</span><span>1</span></div>
  <div class="t"><span>a</span><span>b</span><span>c</span><span>あ</span><span>d</span><span>e</span><span>f</span></div>
  <div class="t"><span>a</span><span>（</span><span>b</span></div>
  <div class="t"><span>a</span><span>‐</span><span>b</span></div>
  <div class="t"><span>#</span><span>1</span><span>-</span><span>2</span></div>
  <div class="t"><span>a</span><span>.</span><span>1</span><span>-</span><span>2</span></div>
  <div class="t"><span> </span><span>-</span><span>a</span></div>
  <div class="t"><span>x</span><span>}</span><span>(</span><span>y</span></div>
  <div class="t"><span>x</span><span>é</span><span>(</span><span>y</span></div>
  <div class="h"><span>a</span><span>­</span><span>b</span><span>­</span><span>c</span></div>
</body>
</html>
