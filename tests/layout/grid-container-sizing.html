<!DOCTYPE html>
<!-- Grid: the size of grid containers: inline-grid and floats with
     intrinsic widths (fr, auto, fixed tracks, gaps), auto-height rows
     with fr (indefinite free space), a definite height with fr rows,
     min-height, percentage rows, and the baseline of an inline-grid. -->
<html>
<head>
<meta charset="utf-8">
<title>Grid: container sizing</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .ig { display: inline-grid; background: #eee; vertical-align: baseline; }
  .ig > div { background: #ccc; }
  .a { grid-template-columns: auto 30px 1fr; column-gap: 7px; }
  .b { grid-template-columns: 1fr 2fr; }
  .fl { float: left; display: grid; grid-template-columns: repeat(2, minmax(10px, max-content)); }
  .rows { display: grid; grid-template-rows: 1fr 2fr auto; width: 200px; margin-top: 10px; background: #eee; }
  .fixed { display: grid; grid-template-rows: 1fr 30px 2fr; height: 150px; width: 200px; background: #ddd; }
  .minh { display: grid; grid-template-rows: auto 1fr; min-height: 100px; width: 200px; background: #eee; }
  .pct { display: grid; grid-template-rows: 25% auto; height: 120px; width: 200px; background: #ddd; }
</style>
</head>
<body>
  <div>
    text <div class="ig a"><div>first</div><div>x</div><div>third item</div></div>
    more <div class="ig b"><div>one</div><div>two words</div></div> end
  </div>
  <div style="height: 30px"><div class="fl"><div>float grid</div><div>x</div></div></div>
  <div class="rows"><div>one</div><div>two<br>lines</div><div>three</div></div>
  <div class="fixed"><div>a</div><div>b</div><div>c</div></div>
  <div class="minh"><div>auto</div><div>flexible</div></div>
  <div class="pct"><div>quarter</div><div>rest</div></div>
</body>
</html>
