<!DOCTYPE html>
<!-- Floats with negative margins: a negative margin box width places the
     float but excludes nothing, and negative bottom margins let later
     content move up next to the float. -->
<html>
<head>
<meta charset="utf-8">
<title>Floats with negative margins</title>
<style>
  body { margin: 0; font: 16px/20px sans-serif; }
  .c { width: 400px; clear: both; }
</style>
</head>
<body>
  <div class="c" id="c1">
    <div id="f1" style="float: right; width: 100px; height: 20px; margin-left: -150px; background: #c00"></div>
    <div id="g1" style="float: right; width: 50px; height: 20px; background: #00c"></div>
  </div>
  <div class="c" id="c2">
    <div id="f2" style="float: left; width: 100%; height: 20px; margin-right: -200px; background: #c00"></div>
    <div id="g2" style="float: left; width: 150px; height: 20px; background: #00c"></div>
    <div id="h2" style="float: right; width: 50px; height: 20px; background: #0c0"></div>
  </div>
  <div class="c" id="c3">
    <div id="f3" style="float: left; width: 100px; height: 20px; margin-bottom: -50px; background: #c00"></div>
    <div id="g3" style="float: left; width: 100px; height: 20px; background: #00c"></div>
    <div id="t3" style="overflow: hidden; height: 10px"></div>
  </div>
</body>
</html>
