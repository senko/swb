<!DOCTYPE html>
<!-- Flexbox: the baseline of a flex container comes from its startmost
     item; an item without a baseline (an empty icon) gets one synthesized
     from its bottom border edge (CSS Flexbox 1 §8.5). Wikipedia's
     icon buttons are inline-flex labels that start with an empty icon. -->
<html>
<head>
<meta charset="utf-8">
<title>Inline-flex baseline</title>
<style>
  body { margin: 8px; font: 16px/1.6 sans-serif; }
  label { display: inline-flex; align-items: center; height: 32px; padding: 0 6px; background: #ddd; }
  .icon { display: inline-block; width: 20px; height: 20px; background: #444; }
</style>
</head>
<body>
  <div>before <label><span class="icon"></span></label> after</div>
  <div>before <label><span class="icon"></span><span>text</span></label> after</div>
</body>
</html>
