<!DOCTYPE html>
<!-- Nested clearance: a block with clear: left contains a block with
     clear: right and a top margin. The inner clearance decides where the
     outer block's margins end; the outer block then clears the left
     float on its own. -->
<html>
<head>
<meta charset="utf-8">
<title>Nested clearance</title>
<style>
  body { margin: 0; font: 16px/20px sans-serif; }
  .f { float: left; width: 50px; height: 40px; background: #c00; }
  .r { float: right; width: 50px; height: 100px; background: #00c; }
</style>
</head>
<body>
  <div id="c1" style="border-top: 1px solid">
    <div id="f1" class="f"></div><div id="r1" class="r"></div>
    <div id="i1" style="clear: left; background: #ccc"><div id="j1" style="clear: right; margin-top: 50px">x</div></div>
  </div>
  <div id="c2" style="border-top: 1px solid; clear: both">
    <div id="f2" class="f"></div><div id="r2" class="r"></div>
    <div id="i2" style="clear: left; background: #ccc"><div id="k2"><div id="j2" style="clear: right; margin-top: 50px">x</div></div></div>
  </div>
  <div id="c3" style="border-top: 1px solid; clear: both">
    <div id="f3" class="f"></div><div id="r3" class="r"></div>
    <div id="i3" style="clear: left; margin-top: 10px; background: #ccc"><div id="j3" style="clear: right; margin-top: 50px; overflow: hidden">x</div></div>
  </div>
</body>
</html>
