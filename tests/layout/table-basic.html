<!DOCTYPE html>
<!-- Table layout: automatic column widths from cell content, default
     border-spacing (2px) and cell padding (1px), row heights from the
     tallest cell, the table's border and padding. -->
<html>
<head>
<meta charset="utf-8">
<title>Basic table</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  td, th { background: #ddd; }
</style>
</head>
<body>
  <table id="t1">
    <tr><th>Name</th><th>Value</th></tr>
    <tr><td>first</td><td>a longer cell text</td></tr>
    <tr><td>second<br>line</td><td>x</td></tr>
  </table>
  <table id="t2" style="border: 3px solid; padding: 5px; margin-top: 10px">
    <tr><td>one</td><td>two</td><td>three</td></tr>
  </table>
  <table id="t3" style="border-spacing: 10px 4px">
    <tr><td>a</td><td>b</td></tr>
    <tr><td>c</td><td>d</td></tr>
  </table>
  <div style="width: 150px">
    <table id="t4"><tr><td>words that wrap because the table cannot be wider than its container</td><td>x</td></tr></table>
  </div>
</body>
</html>
