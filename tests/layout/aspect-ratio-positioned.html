<!DOCTYPE html>
<!-- aspect-ratio on absolutely positioned boxes: a width gives the height;
     a height gives the width unless both horizontal insets are set; insets
     on both sides of an axis stretch it only if the other axis does not;
     the content makes the box grow unless it clips. -->
<html>
<head>
<meta charset="utf-8">
<title>aspect-ratio: absolutely positioned boxes</title>
<style>
  body { margin: 0; font: 16px/20px sans-serif; }
  .cb { position: relative; width: 400px; height: 300px; margin-bottom: 10px; }
  .r { aspect-ratio: 2 / 1; position: absolute; }
</style>
</head>
<body>
<div class="cb">
  <div class="r" style="width: 100px; top: 0; left: 0"></div>
  <div class="r" style="left: 10px; right: 50px; top: 0"></div>
  <div class="r" style="height: 40px; top: 0; left: 0"></div>
  <div class="r"></div>
  <div class="r" style="top: 20px; bottom: 100px; left: 0"></div>
  <div class="r" style="top: 20px; bottom: 100px; left: 0; right: 0"></div>
  <div class="r" style="left: 0; right: 0; top: 0; bottom: 0"></div>
</div>
<div class="cb">
  <div class="r" style="top: 0; left: 0"><div style="width: 80px; height: 10px"></div></div>
  <div class="r" style="top: 100px; left: 0; overflow: hidden"><div style="width: 80px; height: 100px"></div></div>
  <div class="r" style="top: 100px; left: 200px"><div style="width: 80px; height: 100px"></div></div>
  <div class="r" style="top: 0; left: 200px; width: 100px"><div style="width: 50px; height: 20px"></div></div>
</div>
</body>
</html>
