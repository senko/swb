<!DOCTYPE html>
<!-- Margin collapsing (CSS 2.2 §8.3.1): a box with zero height collapses
     through; margins of empty children escape through the bottom of a
     parent with a top border. -->
<html>
<head>
<meta charset="utf-8">
<title>Margins collapsing through empty boxes</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .box { height: 10px; background: #ccc; }
  .spacer { height: 0; margin: 10px 0; }
  .bordered { border-top: 1px solid; }
  .empty { margin: 12px 0; }
</style>
</head>
<body>
  <div class="box"></div>
  <div class="spacer"></div>
  <div class="box"></div>
  <div class="bordered"><div class="empty"></div></div>
  <div class="box"></div>
  <div class="bordered" style="padding-bottom: 2px"><div class="empty"></div></div>
  <div class="box"></div>
</body>
</html>
