<!DOCTYPE html>
<!-- Replaced elements with size containment: the natural size is the
     contain-intrinsic-size (0 for none) and there is no natural aspect
     ratio, whatever the image is. `sizes="auto"` gives the user-agent rule
     `contain: size !important; contain-intrinsic-size: 300px 150px`; the
     attribute selector does not trim white space. The width and height
     attributes still give an aspect ratio hint. The images are 100x50
     files; an unloaded or broken image sizes the same way. -->
<html>
<head>
<meta charset="utf-8">
<title>Size containment on images</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  img { display: block; margin-bottom: 2px; }
  .c { contain: size; }
</style>
</head>
<body>
<img id=a class=c src="srcset/r100.png?c1">
<img id=b class=c src="srcset/r100.png?c2" style="contain-intrinsic-size: 40px 30px">
<img id=c class=c src="srcset/r100.png?c3" style="contain-intrinsic-size: 40px">
<img id=d class=c src="srcset/r100.png?c4" style="contain-intrinsic-width: 60px">
<img id=e class=c src="srcset/r100.png?c5" width=120 height=60>
<img id=f class=c src="srcset/r100.png?c6" width=120>
<img id=g class=c src="srcset/r100.png?c7" height=60>
<img id=h class=c src="srcset/r100.png?c8" style="width: 200px">
<img id=i class=c src="srcset/r100.png?c9" style="height: 80px; contain-intrinsic-size: 10px">
<img id=j class=c src="srcset/r100.png?c10" style="aspect-ratio: 2 / 1; width: 100px">
<img id=k class=c src="srcset/r100.png?c11" style="aspect-ratio: auto 4 / 1; contain-intrinsic-size: 80px 80px">
<img id=l class=c src="srcset/r100.png?c12" style="max-width: 50px; contain-intrinsic-size: 80px 80px">
<img id=m class=c src="srcset/r100.png?c13" style="padding: 5px; border: 3px solid; contain-intrinsic-size: 80px 40px">
<img id=n class=c src="srcset/r100.png?c14" style="contain-intrinsic-size: auto 70px auto 35px">
<img id=o class=c src="srcset/r100.png?c15" style="contain-intrinsic-size: 1em 2em">
<img id=p class=c src="srcset/r100.png?c16" style="width: 100%; contain-intrinsic-size: 80px 40px">
<img id=q src="srcset/r100.png?c17" style="contain: none; contain-intrinsic-size: 80px 40px">
<img id=r sizes="auto" src="srcset/r100.png?c18">
<img id=s sizes="auto, 50px" src="srcset/r100.png?c19" width=200 height=100>
<img id=t sizes=" auto" src="srcset/r100.png?c20">
<img id=u sizes="auto" src="srcset/r100.png?c21" style="contain-intrinsic-size: 50px 25px; contain: none">
<img id=v sizes="auto" src="srcset/r100.png?c22" style="width: 40px; height: auto">
<div style="display: flex; width: 500px; align-items: flex-start">
  <img id=w sizes="auto" src="srcset/r100.png?c23" style="margin: 0">
  <img id=x sizes="auto" src="srcset/r100.png?c24" style="margin: 0; flex: 1">
</div>
<div style="width: 0">
  <img id=y sizes="auto" src="srcset/r100.png?c25" style="display: inline-block">
</div>
</body>
</html>
