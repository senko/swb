<!-- No doctype: quirks mode. The line height calculation quirk and the
     blocks ignore line-height quirk: the strut of a block or inline box
     counts only if the box has text, a line break, or a horizontal
     border, padding or margin; list items keep the strut. -->
<html>
<head>
<meta charset="utf-8">
<title>Quirks: line height</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  div { margin-bottom: 2px; background: #eee; }
  .ib { display: inline-block; width: 10px; height: 8px; background: #888; }
</style>
</head>
<body>
  <div id="d1"><span class="ib"></span></div>
  <div id="d2"><span><span class="ib"></span></span></div>
  <div id="d3"><span style="padding-left: 5px"><span class="ib"></span></span></div>
  <div id="d4"><span style="margin-right: 1px"><span class="ib"></span></span></div>
  <div id="d5">text<span class="ib"></span></div>
  <div id="d6" style="line-height: 40px"><span style="line-height: 10px; font-size: 8px">small</span></div>
  <div id="d7"><br></div>
  <div id="d8"><span class="ib"></span><br><span class="ib"></span></div>
  <ul><li id="l1"><span class="ib"></span></li></ul>
  <div id="d9" style="font-size: 30px"><span style="font-size: 10px">x</span></div>
  <div id="d10"><img id="i1" width="20" height="10" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="></div>
  <!-- Taller than the viewport, so that the body fills viewport quirk
       (not implemented) does not apply. -->
  <div style="height: 600px"></div>
</body>
</html>
