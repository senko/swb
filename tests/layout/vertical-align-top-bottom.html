<!DOCTYPE html>
<!-- vertical-align: top and bottom align with the line box. -->
<html>
<head>
<meta charset="utf-8">
<title>Vertical-align top and bottom</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .big { font-size: 40px; }
  .ib { display: inline-block; font-size: 10px; width: 10px; height: 10px; background: #ccc; }
</style>
</head>
<body>
  <div class="big"><span class="ib" style="vertical-align: top"></span>X<span class="ib" style="vertical-align: bottom"></span></div>
  <div class="big"><span style="vertical-align: top; font-size: 10px">top</span>X<span style="vertical-align: bottom; font-size: 10px">bottom</span></div>
</body>
</html>
