<!DOCTYPE html>
<!-- White space: a preserved tab advances to the next tab stop (tab-size 8). -->
<html>
<head>
<meta charset="utf-8">
<title>Tabs in preformatted text</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  span { background: #eee; }
</style>
</head>
<body>
<pre><span>a</span>	<span>b</span>
<span>abcdefghij</span>	<span>c</span></pre>
</body>
</html>
