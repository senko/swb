<!DOCTYPE html>
<!-- aspect-ratio on flex items: row items (base size from a definite
     height, flexed width gives the height, the transferred minimum width of
     a stretched item), column items (cross size gives the base height,
     automatic minimum height, a fit-content width from the flexed height). -->
<html>
<head>
<meta charset="utf-8">
<title>aspect-ratio: flex items</title>
<style>
  body { margin: 0; font: 16px/20px sans-serif; }
  .r { aspect-ratio: 2 / 1; }
  .row { display: flex; width: 600px; align-items: flex-start; margin-bottom: 10px; }
  .col { display: flex; flex-direction: column; width: 300px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="row">
  <div class="r" style="width: 100px"></div>
  <div class="r" style="height: 60px"></div>
  <div class="r" style="flex: 1"></div>
  <div class="r" style="flex-basis: 80px"></div>
</div>
<div class="row" style="height: 200px; align-items: stretch">
  <div class="r" style="width: 100px"></div>
  <div class="r" style="height: 60px"></div>
  <div class="r" style="flex: 1"></div>
</div>
<div class="row" style="height: 200px; align-items: stretch">
  <div class="r" style="flex: 1; overflow: hidden"></div>
  <div class="r" style="flex: 1"></div>
</div>
<div class="col">
  <div class="r"></div>
  <div class="r" style="width: 100px"></div>
  <div class="r" style="align-self: flex-start; height: 40px"></div>
  <div class="r" style="flex-shrink: 0; width: 200px"></div>
</div>
<div class="col" style="height: 300px">
  <div class="r" style="flex: 1"></div>
  <div class="r" style="flex: 1; min-height: 0"></div>
</div>
<div class="col" style="height: 200px">
  <div class="r" style="width: 100%"></div>
  <div class="r" style="width: 100%; flex-shrink: 0"></div>
  <div class="r" style="width: 100%; overflow: hidden"></div>
</div>
<div class="col" style="height: 200px">
  <div class="r" style="width: 100%"><div style="height: 180px"></div></div>
  <div class="r" style="width: 100%; overflow: auto"><div style="height: 180px"></div></div>
</div>
</body>
</html>
