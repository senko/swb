<!DOCTYPE html>
<!-- Flexbox: a row container with fixed-width items, flex-grow, a gap,
     cross-axis alignment, and an item sized by its text content. -->
<html>
<head>
<meta charset="utf-8">
<title>Flexbox row</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .row { display: flex; gap: 10px; width: 600px; background: #eee; }
  .row > div { background: #ccc; }
  .fixed { width: 100px; height: 50px; }
  .grow1 { flex-grow: 1; height: 30px; }
  .grow2 { flex-grow: 2; height: 40px; }
  .center { align-items: center; height: 80px; margin-top: 10px; }
  .text { padding: 4px 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="fixed"></div>
    <div class="grow1"></div>
    <div class="grow2"></div>
  </div>
  <div class="row center">
    <div class="fixed"></div>
    <div class="text">Content sized</div>
    <div class="fixed"></div>
  </div>
</body>
</html>
