<!DOCTYPE html>
<!-- Scroll containers scrolled to the end of their range (data-scroll): the
     scrollable overflow rectangle as Chromium computes it. In-flow children
     count with their margin boxes and the end padding; descendants,
     relatively and absolutely positioned boxes with their border boxes;
     content above and left of the padding box is unreachable. The last
     absolutely positioned boxes have their containing block outside the
     scroll container: they do not move when it scrolls. -->
<style>
body { margin: 0; font: 16px/20px sans-serif; }
.s { overflow: auto; width: 100px; height: 100px; padding: 10px; margin: 0 0 10px; }
.b { background: #ccc; }
</style>
<div class=s data-scroll="9999 9999"><div class=b style="height:200px; width:150px; margin:0 30px 30px 0"></div></div>
<div class=s data-scroll="9999 9999"><div class=b style="height:50px"><div class=b style="height:300px; width:250px; margin:0 40px 40px 0"></div></div></div>
<div class=s data-scroll="9999 9999"><div class=b style="position:relative; top:100px; left:80px; height:50px; width:50px"></div><div class=b style="height:20px"></div></div>
<div class=s data-scroll="9999 9999" style="position:relative"><div class=b style="position:absolute; margin:190px 0 0 140px; height:50px; width:50px"></div></div>
<div class=s data-scroll="9999 9999" style="display:flex"><div class=b style="flex:none; width:150px; height:150px; margin:5px 15px 25px 5px"></div></div>
<div class=s data-scroll="9999 9999">aaaaaaaaaaaaaaaaaaaaaaaaaa<br>b<br>c<br>d<br>e<br>f</div>
<div class=s data-scroll="9999 9999"><span class=b style="display:inline-block; width:200px; height:150px; margin:7px"></span></div>
<div class=s data-scroll="9999 9999"><div class=b style="margin:-50px 0 0 -50px; width:300px; height:300px"></div></div>
<div class=s data-scroll="9999 9999" style="border:5px solid"><div class=b style="width:200px; height:200px"></div></div>
<div class=s data-scroll="9999 9999" style="overflow:hidden"><div class=b style="width:200px; height:200px"></div></div>
<div class=s data-scroll="9999 9999" style="overflow:hidden auto"><div class=b style="width:300px; height:200px"></div></div>
<div class=s data-scroll="30 40" style="overflow:scroll"><div class=b style="width:300px; height:300px"></div></div>
<div class=s data-scroll="9999 9999"><div class=s style="margin:150px 0 0" data-scroll="9999 9999"><div class=b style="width:400px; height:400px"></div></div></div>
<div class=s data-scroll="9999 9999"><div><div class=b style="height:200px; margin-bottom:30px"></div></div></div>
<div class=s data-scroll="9999 9999" style="white-space:nowrap">aaaa <span class=b style="margin-right:50px; padding-bottom:200px">bbbbbbbbbbbbbbbb</span></div>
<div class=s data-scroll="9999 9999"><span><div class=b style="width:300px; height:10px; margin-right:30px"></div></span></div>
<div class=s data-scroll="9999 9999"><div style="position:relative; height:20px"><div class=b style="position:absolute; margin:200px 0 0 200px; height:50px; width:50px"></div></div></div>
<div class=s data-scroll="9999 9999"><div class=b style="position:absolute; width:300px; height:300px"></div></div>
<div class=s data-scroll="9999 9999"><div class=b style="height:300px"></div><div class=b style="position:absolute; width:30px; height:30px; margin-top:-250px"></div></div>
