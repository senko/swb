<!DOCTYPE html>
<!-- Flexbox: the flex container's own min-height and max-height. They
     clamp a definite height (§9.2 step 2), the cross size of a single line
     (§9.4 step 8), the main size of a column container before flexing
     (§9.2 step 4), the line length of a wrapping column container (§9.3)
     and the cross size of a multi-line container before align-content
     (§9.4 step 15, §9.6). The minimum wins over the maximum, also for the
     line length. Percentages of items resolve against the clamped
     height. -->
<html>
<head>
<meta charset="utf-8">
<title>Flex container limits</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .r { display: flex; background: #ddd; margin-bottom: 4px; }
  .c { display: flex; flex-direction: column; background: #ccc; margin-bottom: 4px; width: 200px; }
  .i { width: 40px; height: 20px; background: #444; }
  .h50 { height: 50px; }
</style>
</head>
<body>
  <div class="r" style="min-height: 60px; align-items: center"><div class="i"></div><div class="i h50"></div></div>
  <div class="r" style="min-height: 60px; align-items: flex-end"><div class="i"></div></div>
  <div class="r" style="min-height: 60px"><div style="width: 40px">s</div></div>
  <div class="r" style="max-height: 30px; align-items: center"><div class="i h50"></div><div class="i"></div></div>
  <div class="r" style="height: 10px; min-height: 40px"><div style="width: 40px">s</div></div>
  <div class="r" style="height: 100px; max-height: 50px; align-items: flex-end"><div class="i"></div></div>
  <div class="r" style="min-height: 50px; padding: 10px; box-sizing: border-box; align-items: center"><div class="i"></div></div>
  <div style="height: 120px"><div class="r" style="min-height: 50%; align-items: center"><div class="i"></div></div></div>
  <div class="c" style="max-height: 50px"><div class="i" style="height: auto; flex-basis: 30px"></div><div class="i" style="height: auto; flex-basis: 30px"></div><div class="i" style="height: auto; flex-basis: 30px"></div></div>
  <div class="c" style="height: 300px; max-height: 100px"><div class="i" style="flex: 1"></div><div class="i"></div></div>
  <div class="c" style="min-height: 100px; justify-content: center"><div class="i"></div></div>
  <div class="c" style="min-height: 100px; justify-content: space-between"><div class="i"></div><div class="i"></div></div>
  <div class="c" style="max-height: 40px"><div class="i" style="height: 30px; flex-shrink: 0"></div><div class="i" style="height: 30px; flex-shrink: 0"></div></div>
  <div class="c" style="flex-wrap: wrap; max-height: 60px"><div class="i" style="height: 25px"></div><div class="i" style="height: 25px"></div><div class="i" style="height: 25px"></div></div>
  <div class="c" style="flex-wrap: wrap; min-height: 100px; max-height: 50px; align-content: flex-start"><div class="i" style="height: 25px"></div><div class="i" style="height: 25px"></div><div class="i" style="height: 25px"></div></div>
  <div class="c" style="height: 300px; max-height: 100px"><div class="i" style="height: auto; min-height: 50%"></div></div>
  <div class="r" style="flex-wrap: wrap; width: 100px; min-height: 100px"><div class="i"></div><div class="i"></div><div class="i" style="height: auto">s</div></div>
  <div class="r" style="flex-wrap: wrap; width: 100px; min-height: 100px; align-content: center"><div class="i"></div><div class="i"></div><div class="i"></div></div>
  <div class="r" style="flex-wrap: wrap; width: 100px; max-height: 30px"><div class="i"></div><div class="i"></div><div class="i"></div></div>
</body>
</html>
