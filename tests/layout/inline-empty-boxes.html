<!DOCTYPE html>
<!-- Inline layout: inline boxes without content make no line box (zero
     height); an empty inline box with border or padding makes one. -->
<html>
<head>
<meta charset="utf-8">
<title>Empty inline boxes</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .edges { border: 2px solid; padding: 3px; }
  div { background: #eee; }
</style>
</head>
<body>
  <div id="a"><span></span></div>
  <div id="b"> <span> </span> <b></b> </div>
  <div id="c"><span class="edges"></span><p style="margin: 0">After a block</p></div>
  <div id="d"><span class="edges"></span></div>
  <div id="e">text</div>
</body>
</html>
