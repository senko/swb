<!DOCTYPE html>
<!-- Block layout: vertical margin collapsing between siblings, between a
     parent and its first and last child, and through an empty block. -->
<html>
<head>
<meta charset="utf-8">
<title>Block margin collapsing</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  div { background: #ddd; }
  .a { margin: 10px 0 20px; height: 30px; }
  .b { margin: 30px 0 10px; height: 30px; }
  .parent { margin-top: 15px; background: #bbb; }
  .first { margin-top: 25px; height: 20px; }
  .last { margin-bottom: 40px; height: 20px; }
  .empty { margin: 12px 0 18px; }
  .negative { margin-top: -5px; height: 10px; }
  .bordered { margin: 20px 0; border-top: 1px solid black; padding-bottom: 4px; }
  .bordered > p { margin: 16px 0; }
</style>
</head>
<body>
  <div class="a"></div>
  <div class="b"></div>
  <div class="parent">
    <div class="first"></div>
    <div class="last"></div>
  </div>
  <div class="empty"></div>
  <div class="negative"></div>
  <div class="bordered"><p>Text in a paragraph.</p></div>
</body>
</html>
