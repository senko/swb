<!DOCTYPE html>
<!-- Flexbox: auto margins in the main axis (css-flexbox-1 §8.1): they take
     the free space before justify-content; with negative free space they
     are 0. -->
<html>
<head>
<meta charset="utf-8">
<title>Flex main-axis auto margins</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .c { display: flex; width: 400px; height: 40px; background: #eee; margin-bottom: 10px; }
  .col { flex-direction: column; height: 200px; width: 100px; }
  .i { width: 50px; height: 30px; background: #ccc; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="c"><div class="i"></div><div class="i" style="margin-left: auto"></div></div>
  <div class="c"><div class="i" style="margin: 0 auto"></div><div class="i"></div></div>
  <div class="c"><div class="i" style="margin-left: auto"></div><div class="i" style="margin-left: auto"></div></div>
  <div class="c" style="justify-content: flex-end"><div class="i" style="margin-right: auto"></div><div class="i"></div></div>
  <div class="c" style="width: 80px"><div class="i" style="margin-left: auto"></div><div class="i" style="margin: 0 auto"></div></div>
  <div class="c"><div class="i" style="margin-left: auto; flex: 1"></div><div class="i" style="margin-left: auto"></div></div>
  <div class="c col"><div class="i"></div><div class="i" style="margin-top: auto"></div></div>
  <div class="c col"><div class="i" style="margin: auto 0"></div></div>
  <div class="c col" style="height: 40px"><div class="i" style="margin-top: auto"></div><div class="i" style="margin: auto 0"></div></div>
  <div class="c col" style="flex-direction: column-reverse"><div class="i" style="margin-top: auto"></div><div class="i"></div></div>
</body>
</html>
