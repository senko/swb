<!DOCTYPE html>
<!-- Grid: item alignment (justify-items, justify-self, align-items,
     align-self, auto margins, stretch, place-items) and content
     distribution (justify-content, align-content). -->
<html>
<head>
<meta charset="utf-8">
<title>Grid: alignment</title>
<style>
  body { margin: 8px; font: 12px/16px sans-serif; }
  .g { display: grid; grid-template-columns: 100px 100px 100px; grid-template-rows: 50px 50px;
       margin-bottom: 8px; background: #eee; }
  .g > div { background: #ccc; }
  .items { justify-items: center; align-items: end; }
  .self > div:nth-child(1) { justify-self: end; align-self: center; }
  .self > div:nth-child(2) { justify-self: start; align-self: start; width: 40px; }
  .self > div:nth-child(3) { margin: auto; }
  .self > div:nth-child(4) { margin-left: auto; height: 20px; }
  .self > div:nth-child(5) { place-self: stretch; }
  .self > div:nth-child(6) { justify-self: left; align-self: flex-end; height: 10px; width: 10px; }
  .content { width: 500px; height: 200px; }
  .between { justify-content: space-between; align-content: space-around; }
  .evenly { justify-content: space-evenly; align-content: center; }
  .end { justify-content: end; align-content: end; }
  .place { place-items: center start; }
</style>
</head>
<body>
  <div class="g items"><div>a</div><div>b</div><div>c</div><div style="justify-self: stretch">d</div></div>
  <div class="g self"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div></div></div>
  <div class="g content between"><div>a</div><div>b</div><div>c</div><div>d</div></div>
  <div class="g content evenly"><div>a</div><div>b</div><div>c</div><div>d</div></div>
  <div class="g content end"><div>a</div><div>b</div></div>
  <div class="g place"><div>a</div><div>b</div></div>
</body>
</html>
