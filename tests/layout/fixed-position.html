<!DOCTYPE html>
<!-- Fixed positioning: the containing block is the viewport, also inside
     positioned and clipping ancestors; a transformed ancestor is the
     containing block instead (CSS Transforms 1 §1). -->
<html>
<head>
<meta charset="utf-8">
<title>Fixed positioning</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .fixed { position: fixed; background: #ccc; }
</style>
</head>
<body>
  <div style="height: 2000px">
    <div class="fixed" id="f1" style="top: 0; left: 0; right: 0; height: 30px"></div>
    <div class="fixed" id="f2" style="bottom: 10px; right: 10px; width: 50px; height: 20px"></div>
    <div style="position: relative; overflow: hidden; width: 100px; height: 100px; margin: 50px">
      <div class="fixed" id="f3" style="top: 200px; left: 300px; width: 40px; height: 40px"></div>
      <div class="fixed" id="f4">static position</div>
    </div>
    <div id="t" style="transform: translate(10px, 20px); width: 200px; height: 100px; margin-left: 100px">
      <div class="fixed" id="f5" style="top: 5px; left: 5px; width: 20px; height: 20px"></div>
    </div>
    <div class="fixed" id="f6" style="top: 50%; left: 25%; width: 50%; height: 10%"></div>
    <div id="z" style="transform: translateZ(0); width: 100px; height: 50px; margin-left: 30px">
      <div class="fixed" id="f7" style="bottom: 0; right: 0; width: 10px; height: 10px"></div>
    </div>
  </div>
</body>
</html>
