<!DOCTYPE html>
<!-- Float placement (CSS 2.2 §9.5.1): left and right floats side by side,
     a float that does not fit moves down, the top of a float is not above
     an earlier float, margins of floats, floats wider than the containing
     block, floats that overflow their parent and narrow the following
     content. -->
<html>
<head>
<meta charset="utf-8">
<title>Float placement</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .r { width: 300px; display: flow-root; border: 1px solid; margin-bottom: 10px; }
  .l { float: left; width: 100px; height: 30px; background: #c00; }
  .rt { float: right; width: 100px; height: 30px; background: #00c; }
</style>
</head>
<body>
  <div class="r" id="r1">
    <div class="l" id="a1"></div>
    <div class="l" id="b1" style="height: 20px"></div>
    <div class="rt" id="c1" style="height: 40px"></div>
    <div class="l" id="d1" style="width: 150px; height: 10px"></div>
    <div class="rt" id="e1" style="width: 10px; height: 10px"></div>
  </div>
  <div class="r" id="r2">
    <div class="l" id="a2"></div>
    <div class="l" id="b2" style="width: 400px; height: 10px"></div>
    <div class="rt" id="c2" style="width: 350px; height: 10px"></div>
  </div>
  <div class="r" id="r3">
    <div class="rt" id="a3" style="margin: 5px 10px 15px 20px"></div>
    <div class="l" id="b3" style="margin: 10px 5px"></div>
    <div class="l" id="c3" style="margin-left: -20px; margin-right: -50px"></div>
    <div class="l" id="d3" style="width: 60px"></div>
  </div>
  <div style="width: 300px" id="p4">
    <div id="o4" style="height: 10px"><div class="l" id="a4" style="height: 50px"></div></div>
    <p id="t4" style="margin: 0">Text next to a float that overflows its parent.</p>
    <div class="rt" id="b4" style="height: 10px"></div>
  </div>
</body>
</html>
