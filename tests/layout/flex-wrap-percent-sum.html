<!DOCTYPE html>
<!-- Flexbox: items of 20%, 60% and 20% of 976 px fill one line of a
     wrapping container. Chromium adds sizes of 1/64 px that it
     truncates, so the sum never passes the line; the sum of 32-bit
     floats can (BBC's cookie banner, M9 feature 7). The last two
     containers test the truncation (M9 feature 7 review). -->
<html>
<head>
<meta charset="utf-8">
<title>Flex wrap, percentages that add up to the line</title>
<style>
  body { margin: 0; font: 16px/20px sans-serif; }
  .wrap { display: flex; flex-wrap: wrap; width: 976px; background: #eee; }
  .wrap > div { height: 20px; background: #ccc; }
  .a { width: 20%; }
  .b { width: 60%; box-sizing: border-box; padding-left: 3.5%; }
  .q1 { width: 25.001%; }
  .q3 { width: 25.003%; }
</style>
</head>
<body>
  <div class="wrap"><div class="a"></div><div class="b"></div><div class="a"></div></div>
  <div class="wrap" style="width: 1000px"><div class="a"></div><div class="b"></div><div class="a"></div></div>
  <div class="wrap" style="width: 333px"><div class="a"></div><div class="b"></div><div class="a"></div></div>
  <!-- Truncated to 1/64 px, 250.01 is 250: one line. 250.03 is
       250.015625: four make 1000.0625, so the last item wraps. -->
  <div class="wrap" style="width: 1000px"><div class="q1"></div><div class="q1"></div><div class="q1"></div><div class="q1"></div></div>
  <div class="wrap" style="width: 1000px"><div class="q3"></div><div class="q3"></div><div class="q3"></div><div class="q3"></div></div>
</body>
</html>
