<!-- Form controls in quirks mode (no doctype), as on Hacker News: inputs
     and text areas have box-sizing: border-box. (Fixed heights avoid the
     quirks-mode body height.) -->
<html>
<head>
<meta charset="utf-8">
<title>Forms in quirks mode</title>
<style>
  html { height: 500px; }
  body { margin: 8px; height: 450px; font: 13px verdana, sans-serif; }
  div { margin-bottom: 10px; }
  input { font-family: monospace; font-size: 10pt; }
  input[type='submit'] { font-family: Verdana, Geneva, sans-serif; }
  textarea { font-family: monospace; font-size: 10pt; }
</style>
</head>
<body>
  <form method="get" action="//example.test/">Search: <input type="text" name="q" size="17"></form>
  <form action="login" method="post"><input type="hidden" name="goto" value="news">
  <div>username: <input type="text" name="acct" size="20"></div>
  <div>password: <input type="password" name="pw" size="20"></div>
  <input type="submit" value="login"></form>
  <form><div>text <textarea name="text" rows="8" cols="80"></textarea></div><input type="submit" value="add comment"></form>
</body>
</html>
