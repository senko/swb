<!DOCTYPE html>
<!-- Static position of absolutely positioned boxes in block flow: the
     position the box would have had in the normal flow (CSS 2.2 §10.3.7,
     §10.6.4), also next to collapsing margins. -->
<html>
<head>
<meta charset="utf-8">
<title>Absolute positioning: static position in block flow</title>
<style>
  body { margin: 8px; font: 16px/20px sans-serif; }
  .cb { position: relative; width: 300px; padding: 5px; border: 1px solid; margin-bottom: 20px; }
  .abs { position: absolute; width: 30px; height: 10px; background: #ccc; }
  .m { margin: 15px 0; height: 20px; background: #eee; }
</style>
</head>
<body>
  <div class="cb">
    <div class="m" id="a1">first</div>
    <div class="abs" id="s1"></div>
    <div class="m" id="a2">second</div>
    <div class="abs" id="s2" style="margin-top: 7px; margin-left: 9px"></div>
  </div>
  <div class="cb">
    <div style="padding-left: 25px">
      <div class="abs" id="s3"></div>
      <div class="m">nested</div>
    </div>
    <div class="abs" id="s4" style="left: 50px"></div>
  </div>
  <div class="cb" style="padding: 0; border: 0">
    <div style="margin-top: 30px">
      <div class="abs" id="s5"></div>
      <div class="m" id="a5">collapsing</div>
    </div>
  </div>
  <div class="cb">
    <div class="abs" id="s6" style="top: 5px"></div>
    <div class="abs" id="s7" style="right: 5px"></div>
    <div class="abs" id="s8" style="bottom: 0"></div>
    <p style="margin: 0">text after the boxes</p>
  </div>
</body>
</html>
