[package]
name = "swb"
description = "The swb web browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Media playback with FFmpeg (ADR 0047 section 3). Off by default: the
# default build needs no C library. M14 feature 3 uses it for `--version`
# and `--licenses`; later features pass it on to swb-engine.
media = ["swb-media/ffmpeg", "swb-media/net"]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
swb-automation.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
softbuffer.workspace = true
swb-dom.workspace = true
swb-engine.workspace = true
swb-layout.workspace = true
swb-media.workspace = true
swb-net.workspace = true
swb-paint.workspace = true
swb-style.workspace = true
swb-text.workspace = true
tiny-skia.workspace = true
winit.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# ADR 0029: jemalloc does not build for MSVC; Windows keeps the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace = true
