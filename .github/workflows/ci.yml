name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny

      - uses: astral-sh/setup-uv@v6

      # Crates for all platforms: the build only downloads the host's, but
      # `cargo deny --offline` reads the metadata of all of them.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # The same checks as `just check`. Tests that need Chromium are
      # skipped when it is not installed.
      - name: Check
        run: just check

      - name: Security advisories
        run: just audit
        continue-on-error: true
