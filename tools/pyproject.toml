[project]
name = "swbtools"
version = "0.1.0"
description = "Test tools for swb: fixture capture, Chromium references, comparisons."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    # Pinned: 1.60.0 uses Chromium revision 1223 (148.0.7778.96). A different
    # version needs a different browser download and can change references.
    "playwright==1.60.0",
    "pillow>=12.0",
    "numpy>=2.3",
    # The client of swb's automation protocol (WebSocket). 17.1 added the
    # `legacy` argument of `connect`.
    "websockets>=17.1",
    "fonttools[woff]>=4.60",
]

[project.scripts]
swbtools = "swbtools.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "ANN"]
ignore = ["ANN401"]
# The marks of the line break data files (tools/swbtools/linebreaks.py).
allowed-confusables = ["×", "÷"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
