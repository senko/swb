<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  fontconfig configuration with only the bundled test fonts.

  Run Chromium with FONTCONFIG_FILE set to the absolute path of this file.
  It then uses the same fonts as swb's FontContext::for_tests(), which uses
  GenericFamilyMap::bundled(). Keep both in sync.

  The rules run in document order:
  1. metric-compatible aliases for common named families;
  2. sans-serif for patterns without a generic family (as 49-sansserif.conf);
  3. generic families;
  4. the fallback order for characters that no requested family has.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- 1. Metric-compatible aliases. -->
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arimo</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Tinos</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Cousine</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

  <!-- 2. Patterns without a generic family get sans-serif. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>

  <!-- 3. Generic families. "sans" and "mono" are fontconfig spellings that
       Chromium also uses. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>mono</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>cursive</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>fantasy</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>math</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>

  <!-- 4. Fallback order. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>Liberation Sans</string>
      <string>Liberation Serif</string>
      <string>Liberation Mono</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
</fontconfig>
